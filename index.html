<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم سوارة الأحلام الذكية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; width: 100%; max-width: 450px; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
        h1 { font-size: 1.4rem; text-align: center; margin-bottom: 20px; color: #38bdf8; }
        .status-box { background: #0f172a; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        .status-item { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.95rem; }
        .status-item:last-child { margin-bottom: 0; }
        .label { color: #94a3b8; }
        .value { font-weight: bold; color: #f1f5f9; }
        .controls { display: flex; flex-direction: column; gap: 12px; }
        button { background: #0284c7; color: #white; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
        button.active { background: #16a34a; }
        button.active:hover { background: #15803d; }
        .input-group { display: flex; gap: 8px; margin-top: 5px; }
        input[type="text"] { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.9rem; }
        .log { margin-top: 15px; font-size: 0.8rem; color: #64748b; text-align: center; }
    </style>
</head>
<body>

    <div class="container">
        <h1>سوارة الأحلام الذكية</h1>
        
        <div class="status-box">
            <div class="status-item">
                <span class="label">حالة الجهاز:</span>
                <span id="deviceState" class="value" style="color: #ef4444;">متوقف (Day Mode)</span>
            </div>
            <div class="status-item">
                <span class="label">آخر حلم مسجل:</span>
                <span id="lastDream" class="value">حلم الطيران الافتراضي</span>
            </div>
            <div class="status-item">
                <span class="label">نسبة البطارية:</span>
                <span id="batteryLevel" class="value">85%</span>
            </div>
        </div>

        <div class="controls">
            <button id="modeToggleBtn" onclick="toggleMode()">تفعيل وضع الأحلام (Dream Mode)</button>
            
            <div>
                <span class="label" style="font-size: 0.85rem; display: block; margin-bottom: 5px;">تحديث اسم الحلم الأخير:</span>
                <div class="input-group">
                    <input type="text" id="newDreamInput" placeholder="اكتب اسم الحلم الجديد...">
                    <button onclick="updateDream()" style="padding: 10px 15px;">حفظ</button>
                </div>
            </div>
        </div>

        <div class="log" id="logStatus">جاهز للاتصال بالسوارة...</div>
    </div>

    <script>
        let isDreamMode = false;

        function toggleMode() {
            isDreamMode = !isDreamMode;
            const btn = document.getElementById('modeToggleBtn');
            const stateSpan = document.getElementById('deviceState');
            
            if (isDreamMode) {
                btn.textContent = "إيقاف وضع الأحلام";
                btn.className = "active";
                stateSpan.textContent = "يعمل (Dream Mode ON)";
                stateSpan.style.color = "#22c55e";
                document.getElementById('logStatus').textContent = "تم إرسال أمر الدخول لوضع الأحلام بنجاح.";
            } else {
                btn.textContent = "تفعيل وضع الأحلام (Dream Mode)";
                btn.className = "";
                stateSpan.textContent = "متوقف (Day Mode)";
                stateSpan.style.color = "#ef4444";
                document.getElementById('logStatus').textContent = "تم العودة للوضع العادي.";
            }
        }

        function updateDream() {
            const inputVal = document.getElementById('newDreamInput').value.trim();
            if (inputVal !== "") {
                document.getElementById('lastDream').textContent = inputVal;
                document.getElementById('newDreamInput').value = "";
                document.getElementById('logStatus').textContent = "تم تحديث الحلم الأخير وحفظه في الذاكرة.";
            } else {
                alert("الرجاء كتابة اسم الحلم أولاً!");
            }
        }
    </script>

</body>
</html>
