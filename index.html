<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إدارة سوارة الأحلام الذكية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { 
            background: linear-gradient(135deg, #090d16 0%, #111c33 100%); 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { 
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(10px);
            width: 100%; 
            max-width: 480px; 
            padding: 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
            border: 1px solid rgba(51, 65, 85, 0.6); 
        }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 25px; color: #38bdf8; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        
        .status-box { 
            background: rgba(15, 23, 42, 0.7); 
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(51, 65, 85, 0.4); 
        }
        .status-item { display: flex; justify-content: space-between; margin-bottom: 14px; font-size: 0.95rem; }
        .status-item:last-child { margin-bottom: 0; }
        .label { color: #94a3b8; }
        .value { font-weight: bold; color: #f1f5f9; }
        
        .controls { display: flex; flex-direction: column; gap: 14px; }
        
        .btn { 
            width: 100%; 
            background: #0284c7; 
            color: #fff; 
            border: none; 
            padding: 14px; 
            border-radius: 14px; 
            font-size: 1rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn:hover { background: #0369a1; transform: translateY(-1px); }
        .btn-bluetooth { background: #7c3aed; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
        .btn-bluetooth:hover { background: #6d28d9; }
        
        .log { margin-top: 20px; font-size: 0.85rem; color: #64748b; text-align: center; padding: 8px; border-radius: 8px; background: rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div class="container">
        <h1>سوارة الأحلام الذكية</h1>
        
        <div class="status-box">
            <div class="status-item">
                <span class="label">حالة الاتصال:</span>
                <span id="connectionStatus" class="value" style="color: #ef4444;">غير متصل</span>
            </div>
            <div class="status-item">
                <span class="label">كود التصنيع (Serial):</span>
                <span id="deviceSerial" class="value">-</span>
            </div>
            <div class="status-item">
                <span class="label">نسبة البطارية:</span>
                <span id="batteryLevel" class="value">-</span>
            </div>
            <div class="status-item">
                <span class="label">وضع السوارة:</span>
                <span id="deviceMode" class="value">نهاري (Day Mode)</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-bluetooth" onclick="connectBluetooth()">بحث والاتصال بالسوارة (Bluetooth)</button>
            <button class="btn" onclick="toggleDreamMode()">تبديل وضع الأحلام</button>
        </div>

        <div class="log" id="logStatus">قم بتشغيل البلوتوث واضغط للبحث عن جهازك...</div>
    </div>

    <script>
        async function connectBluetooth() {
            const logEl = document.getElementById('logStatus');
            const statusEl = document.getElementById('connectionStatus');
            
            try {
                logEl.textContent = "جاري البحث عن أجهزة الأحلام القريبة...";
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['battery_service']
                });
                
                statusEl.textContent = "متصل: " + device.name;
                statusEl.style.color = "#22c55e";
                logEl.textContent = "تم الاتصال بنجاح! جاري سحب كود التصنيع...";
                
                // افتراضي تجريبي لحين ربط الـ ESP32 الحقيقي
                document.getElementById('deviceSerial').textContent = "SM-DREAM-9482";
                document.getElementById('batteryLevel').textContent = "92%";
                
            } catch (error) {
                console.log("فشل الاتصال:", error);
                logEl.textContent = "تم إلغاء الاتصال أو حدث خطأ.";
            }
        }

        function toggleDreamMode() {
            const modeEl = document.getElementById('deviceMode');
            if (modeEl.textContent.includes('نهاري')) {
                modeEl.textContent = "وضع الأحلام (Dream Mode ON)";
                modeEl.style.color = "#a855f7";
                document.getElementById('logStatus').textContent = "تم تفعيل وضع الأحلام على السوارة.";
            } else {
                modeEl.textContent = "نهاري (Day Mode)";
                modeEl.style.color = "#f1f5f9";
                document.getElementById('logStatus').textContent = "تم العودة للوضع العادي.";
            }
        }
    </script>

</body>
</html>
