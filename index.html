<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM Store - منصة إدارة سبرة الأحلام الذكية</title>
    <!-- استدعاء مكتبة MQTT للربط بالسيرفر السحابي -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { 
            background: linear-gradient(135deg, #070913 0%, #0f172a 100%); 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 15px; 
        }
        .app-container { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(12px);
            width: 100%; 
            max-width: 460px; 
            padding: 24px; 
            border-radius: 24px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.7); 
            border: 1px solid rgba(51, 65, 85, 0.5); 
        }
        
        /* الهيدر والعنوان */
        .app-header { text-align: center; margin-bottom: 20px; }
        .app-header h1 { font-size: 1.35rem; color: #38bdf8; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .app-header p { font-size: 0.8rem; color: #94a3b8; }

        /* شريط التنقل بين الأقسام (Tabs) */
        .nav-tabs { 
            display: flex; 
            background: rgba(30, 41, 59, 0.7); 
            border-radius: 12px; 
            padding: 4px; 
            margin-bottom: 20px; 
            border: 1px solid rgba(51, 65, 85, 0.4);
        }
        .tab-btn { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: #94a3b8; 
            padding: 10px; 
            font-size: 0.85rem; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            transition: all 0.2s ease; 
        }
        .tab-btn.active { 
            background: #0284c7; 
            color: #fff; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
        }

        /* محتوى الأقسام */
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* صناديق المعلومات */
        .card { 
            background: rgba(30, 41, 59, 0.5); 
            padding: 16px; 
            border-radius: 14px; 
            margin-bottom: 15px; 
            border: 1px solid rgba(51, 65, 85, 0.3); 
        }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .info-row:last-child { margin-bottom: 0; }
        .label { color: #94a3b8; }
        .value { font-weight: bold; color: #f1f5f9; }

        /* الأزرار والتحكم */
        .btn { 
            width: 100%; 
            background: #0284c7; 
            color: #fff; 
            border: none; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 0.95rem; 
            font-weight: bold; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            margin-bottom: 10px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn:hover { background: #0369a1; transform: translateY(-1px); }
        .btn-purple { background: #7c3aed; box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3); }
        .btn-purple:hover { background: #6d28d9; }
        .btn-success { background: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }

        /* صندوق السجل واللوغ */
        .log-box { 
            background: #090d16; 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 0.8rem; 
            color: #38bdf8; 
            font-family: monospace; 
            height: 90px; 
            overflow-y: auto; 
            border: 1px solid rgba(51, 65, 85, 0.4);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الهيدر -->
        <div class="app-header">
            <h1>SM Store - لوحة الأحلام</h1>
            <p>إدارة السوارة والاتصال السحابي اللحظي</p>
        </div>

        <!-- أزرار التنقل بين الأقسام -->
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'dashboardTab')">المراقبة</button>
            <button class="tab-btn" onclick="switchTab(event, 'controlTab')">التحكم</button>
            <button class="tab-btn" onclick="switchTab(event, 'cloudTab')">السحاب</button>
        </div>

        <!-- 1. قسم المراقبة الحية -->
        <div id="dashboardTab" class="tab-content active">
            <div class="card">
                <div class="info-row">
                    <span class="label">حالة السيرفر:</span>
                    <span id="cloudStatus" class="value" style="color: #ef4444;">غير متصل</span>
                </div>
                <div class="info-row">
                    <span class="label">كود التصنيع:</span>
                    <span class="value">SM-SLM-9482</span>
                </div>
                <div class="info-row">
                    <span class="label">نسبة البطارية:</span>
                    <span id="batteryVal" class="value">--</span>
                </div>
                <div class="info-row">
                    <span class="label">الوضع الحالي:</span>
                    <span id="modeVal" class="value">نهاري (Day)</span>
                </div>
            </div>
            <button class="btn btn-purple" onclick="connectCloudServer()">الاتصال بالسيرفر السحابي (AWS/HiveMQ)</button>
        </div>

        <!-- 2. قسم التحكم -->
        <div id="controlTab" class="tab-content">
            <div class="card">
                <div class="info-row" style="margin-bottom: 12px; font-weight: bold; color: #38bdf8;">أوامر السوارة المباشرة</div>
                <button class="btn btn-success" onclick="sendMqttCommand('TOGGLE_MODE')">تبديل وضع الأحلام</button>
                <button class="btn" onclick="sendMqttCommand('TEST_VIBRATION')">اختبار الهزاز الحسي</button>
            </div>
        </div>

        <!-- 3. قسم السحاب والسجلات -->
        <div id="cloudTab" class="tab-content">
            <div class="card">
                <div class="info-row" style="margin-bottom: 8px;">سجل الأحداث والبيانات:</div>
                <div class="log-box" id="logConsole">جاهز للاتصال بالسيرفر السحابي...</div>
            </div>
        </div>
    </div>

    <script>
        // دالة التنقل بين التبويبات
        function switchTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        let client = null;

        // دالة الاتصال بالسيرفر السحابي عبر الـ WebSockets
        function connectCloudServer() {
            const logEl = document.getElementById('logConsole');
            const statusEl = document.getElementById('cloudStatus');
            
            logEl.innerHTML += "<br>جاري الاتصال بسيرفر HiveMQ (AWS)...";

            // بيانات الاتصال الخاصة بك
            const host = 'wss://b737aa7b4ed743e3bc74d7cdef97ba79.s1.eu.hivemq.cloud:8884/mqtt';
            const options = {
                clientId: 'web_client_' + Math.random().toString(16.substring(2, 8)),
                username: 'sslm',
                password: 'slm435738',
                clean: true,
                connectTimeout: 4000
            };

            client = mqtt.connect(host, options);

            client.on('connect', () => {
                statusEl.textContent = "متصل سحابياً";
                statusEl.style.color = "#22c55e";
                logEl.innerHTML += "<br>تم الاتصال بنجاح بالبنية التحتية لسيرفر أمازون!";
                client.subscribe('sm/dream/band/status');
            });

            client.on('error', (err) => {
                logEl.innerHTML += "<br>خطأ في الاتصال: " + err.message;
                statusEl.textContent = "خطأ بالاتصال";
            });

            client.on('message', (topic, payload) => {
                logEl.innerHTML += `<br>رسالة واردة: ${payload.toString()}`;
            });
        }

        // إرسال أوامر عبر السيرفر
        function sendMqttCommand(cmd) {
            const logEl = document.getElementById('logConsole');
            if (client && client.connected) {
                client.publish('sm/dream/band/control', cmd);
                logEl.innerHTML += `<br>تم إرسال أمر: ${cmd}`;
            } else {
                alert("السيرفر غير متصل! اضغط اتصال في قسم المراقبة أولاً.");
            }
        }
    </script>

</body>
</html>
